backend:
  name: github
  repo: qiin/xioneDoc
  branch: main
  # OAuth 代理的域名，见仓库 README「内容管理后台」一节。
  base_url: https://doc.xione.ai

publish_mode: simple
media_folder: "static/img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "getting-started"
    label: "快速开始"
    folder: "docs/getting-started"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - {label: "标题（显示在侧边栏和浏览器标签）", name: "title", widget: "string"}
      - {label: "侧边栏顺序（数字越小越靠前，留空按文件名排序）", name: "sidebar_position", widget: "number", required: false}
      - {label: "正文", name: "body", widget: "markdown"}

  - name: "deployment"
    label: "部署方式"
    folder: "docs/deployment"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
